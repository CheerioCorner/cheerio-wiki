<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>P10 · Demo</title>
<script src="../deck_stage.js"></script>
<style>
:root{--ink:#061428;--ink-rgb:10,31,61;--paper:#f8f9fa;--paper-rgb:241,243,245;--mono:"IBM Plex Mono",ui-monospace,monospace;--serif-en:"Playfair Display",Georgia,serif;--serif-zh:"Noto Serif SC",serif;--sans-zh:"Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans-zh);background:var(--paper);color:var(--ink);overflow:hidden}
.slide{width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 8vw;position:relative;background:var(--paper);overflow:hidden}
.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.25em;text-transform:uppercase;opacity:.55;margin-bottom:3vh}
h1{font-family:var(--serif-zh);font-weight:700;font-size:clamp(48px,5vw,72px);line-height:1.12;letter-spacing:-.005em;margin-bottom:1.5vh}
.subtitle{font-family:var(--sans-zh);font-size:max(20px,1.2vw);opacity:.65;max-width:max-content;line-height:1.5;margin-bottom:2vh}
.note{font-family:var(--mono);font-size:max(17px,1.3vw);opacity:.4;margin-top:2vh;letter-spacing:.1em}
.ghost{position:absolute;font-family:var(--serif-en);font-weight:900;font-size:22vw;line-height:.8;opacity:.03;letter-spacing:-.04em;color:var(--ink);pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%)}
.foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:2.5vh 6vw;font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);opacity:.5}
.foot .title{font-family:var(--serif-zh);font-weight:400;letter-spacing:.05em;text-transform:none;opacity:.7;font-size:14px}
</style>
</head>
<body>
<deck-stage>
<section>
<div class="slide">
  <div class="ghost">DEMO</div>
  <div class="kicker">實機演示</div>
  <h1>現在，讓我們實際操作</h1>
  <p class="subtitle">從「存入 Obsidian」到「提出問題」到「AI 產出 Plan」到「Plannotator 審查」的完整流程。</p>
  <p class="note">⚡ 現場演示</p>
  <div class="foot"><span class="title">Plannotator × Obsidian</span><span>6 / 18</span></div>
</div>
</section>
</deck-stage>
</body>
</html>
